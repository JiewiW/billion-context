name: Dist Bot

# `dist/` is committed so git-source installs work without a build step
# (pnpm blocks dependency build scripts by default — issue #92). This bot
# keeps master's dist fresh WITHOUT touching contributor branches: after every
# merge that can change the build output, it rebuilds and, if the artifacts
# differ, pushes one dist commit directly to master. PR branches never carry
# dist, so contributors never pull bot commits and never resolve dist
# conflicts.
#
# Pushing to the protected master needs the `DIST_BOT_TOKEN` secret — the
# maintainer's fine-grained PAT (Contents: read/write on this repo). Master's
# branch protection has `enforce_admins` disabled, so this admin credential
# may push directly; the default GITHUB_TOKEN cannot, and humans still land
# everything via PRs.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsup.config.ts'
      # Re-run when the bot's own logic changes, so a workflow fix can verify
      # itself (e.g. the --legacy-peer-deps install fix). dist commits do not
      # touch this path, so the loop guard below still holds.
      - '.github/workflows/dist-bot.yml'

permissions:
  contents: write

concurrency:
  group: dist-bot-master
  cancel-in-progress: true

jobs:
  sync-dist:
    # Belt-and-braces loop guard: the dist/ paths filter already keeps this
    # workflow from re-triggering on the bot's own dist commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fork has no protected master, so the workflow's own GITHUB_TOKEN
          # (permissions: contents: write above) is enough to push.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # DSH 0.2.x seam packages pin each other's peer ranges to the exact
        # 0.2.0-rc.2 line, which npm's strict peer resolver cannot reconcile
        # with the 0.2.2-rc5 compat baseline. Match the local install mode.
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Commit fresh dist to master
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo 'dist/ already matches the source — nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          git commit -m "(chore) refresh dist/ after merge ${{ github.sha }} (dist-bot)"
          git push
